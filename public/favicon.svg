<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient: Emerald Deep Teal to Cyber Mint -->
    <linearGradient id="cs-bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="45%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Silk Wave Sheen Gradient -->
    <linearGradient id="cs-silk-sheen" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.4" />
    </linearGradient>

    <!-- Paper Plane Gradient -->
    <linearGradient id="cs-plane-grad" x1="16" y1="14" x2="52" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Wing Shadow / Depth -->
    <linearGradient id="cs-wing-shadow" x1="28" y1="28" x2="40" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.95" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="cs-soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Security Border -->
  <rect width="64" height="64" rx="16" fill="url(#cs-bg-grad)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Diagonal Silk Luster Wave -->
  <path 
    d="M-10 24 Q32 10 74 36 L74 0 L-10 0 Z" 
    fill="url(#cs-silk-sheen)" 
    opacity="0.6" 
  />

  <!-- Subtle Cloud Arc at the base conveying Cloud Infrastructure -->
  <path 
    d="M12 48 C14 42 22 41 24 45 C27 41 37 41 39 46 C42 43 50 44 51 49 C52 50 48 53 44 53 L18 53 C14 53 11 50 12 48 Z" 
    fill="#ffffff" 
    fill-opacity="0.12" 
  />

  <!-- Enhanced Paper Plane / Swift Send Glyph with Security & Precision -->
  <g filter="url(#cs-soft-glow)">
    <!-- Main Right Body -->
    <path 
      d="M51 13 L17 32.5 C15.6 33.2 15.8 35.2 17.3 35.7 L28 39.5 L43 23 L31.5 41 L35.5 49 C36.3 50.5 38.3 50.4 39 48.8 L52.8 15.2 C53.4 13.8 52.2 12.5 51 13 Z" 
      fill="url(#cs-plane-grad)" 
    />
    <!-- Left Underside Fold for realistic 3D depth -->
    <path 
      d="M28 39.5 L31.5 41 L29.5 46.5 C29.1 47.4 28 47.2 27.8 46.3 L28 39.5 Z" 
      fill="url(#cs-wing-shadow)" 
    />
    <!-- Speed/Relay Ring Pulse -->
    <circle cx="51" cy="13" r="2.5" fill="#34d399" />
  </g>
</svg>
